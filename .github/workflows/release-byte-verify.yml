name: Verify offline release byte contract
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
    branches: ["main"]
  pull_request:
    branches: ["main", "release/v0.1.5-queue-item-*", "fix/v0.1.5-duplicate-source-reference", "fix/v0.1.5-duplicate-source-reference-rebuild", "feat/governance-pr-metadata-gate"]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: verify-release-bytes-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Release bytes (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify checked-out event SHA
        if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Report interpreter
        run: python -VV
      - name: Validate project boundary
        run: python scripts/validate.py
      - name: Test source, notes, archive, checksum and readback comparisons
        run: python -m unittest discover -s tests -p "test_release.py" -v

  gate:
    name: Release bytes gate
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: test "$MATRIX_RESULT" = success
