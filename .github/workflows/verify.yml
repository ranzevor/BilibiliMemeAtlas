name: Verify project
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-project-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "windows-2022"]
        python: ["3.10", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Report interpreter
        run: python -VV
      - name: Check deterministic projections
        run: python scripts/build.py --check
      - name: Validate project contracts
        run: python scripts/validate.py
      - name: Run complete verification
        run: python scripts/verify.py
