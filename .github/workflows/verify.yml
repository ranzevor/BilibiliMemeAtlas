name: Verify project
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "release/v0.1.5-queue-item-*", "fix/v0.1.5-duplicate-source-reference", "fix/v0.1.5-duplicate-source-reference-rebuild", "feat/governance-pr-metadata-gate"]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: verify-project-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Project (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "windows-2022"]
        python: ["3.10", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Markdown parser for governance validation
        run: npm install --prefix .github --no-save --no-package-lock --ignore-scripts --no-audit --no-fund markdown-it@15.0.3
      - name: Validate current PR metadata from exact git candidate
        if: ${{ github.event_name == 'pull_request' }}
        run: node .github/scripts/governance_gate.cjs event-git
      - name: Test governance policy regressions
        run: node --test tests/governance_gate.test.cjs tests/governance_gate.integration.test.cjs tests/governance_gate.git.test.cjs
      - name: Remove governance tool dependencies before project validation
        run: node -e "require('node:fs').rmSync('.github/node_modules', {recursive:true, force:true})"
      - name: Report interpreter
        run: python -VV
      - name: Check deterministic projections
        run: python scripts/build.py --check
      - name: Validate project contracts
        run: python scripts/validate.py
      - name: Run complete verification
        run: python scripts/verify.py

      - name: Recheck current PR admission state
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/governance_gate.cjs event-current

  gate:
    name: Project gate
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: test "$MATRIX_RESULT" = success
